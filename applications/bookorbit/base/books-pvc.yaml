apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookorbit-books-pvc
  namespace: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: bookorbit
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/encrypted-backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 200Gi
