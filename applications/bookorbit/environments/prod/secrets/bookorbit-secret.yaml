apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-secret
  namespace: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: bookorbit
  annotations:
    argocd.argoproj.io/sync-wave: "-1000"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  target:
    name: bookorbit-secret
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: bookorbit/bookorbit-secret
        property: jwt-secret
    - secretKey: setup-bootstrap-token
      remoteRef:
        key: bookorbit/bookorbit-secret
        property: setup-bootstrap-token
