apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: personal-website
  namespace: personal-website
  labels:
    app.kubernetes.io/name: personal-website
    app.kubernetes.io/part-of: personal-website
spec:
  namespaceSelector:
    matchNames:
      - personal-website
  selector:
    matchLabels:
      app: personal-website
  endpoints:
    - port: http
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
