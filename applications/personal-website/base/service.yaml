apiVersion: v1
kind: Service
metadata:
  name: personal-website
  namespace: personal-website
  labels:
    app: personal-website
    app.kubernetes.io/name: personal-website
    app.kubernetes.io/part-of: personal-website
spec:
  type: ClusterIP
  selector:
    app: personal-website
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
