apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: searxng
  name: searxng
  namespace: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      imagePullSecrets:
        - name: harbor-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 3000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-config
          image: harbor.okwilkins.dev/docker-hub-cache/searxng/searxng:2026.11.6-ac11e14c5
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /usr/local/searxng/.venv/bin/python
            - -B
            - -c
            - |
              import os
              from pathlib import Path
              import yaml

              api_key = Path("/run/secrets/exa/api-key").read_text().strip()
              if not api_key:
                  raise SystemExit("Exa API key must not be empty")
              settings = yaml.safe_load(Path("/tmp/config/settings.yml").read_text())
              engine = next(item for item in settings["engines"] if item["name"] == "exaapi")
              engine["api_key"] = api_key
              os.umask(0o077)
              Path("/etc/searxng/settings.yml").write_text(yaml.safe_dump(settings, sort_keys=False))
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config-source
              mountPath: /tmp/config
              readOnly: true
            - name: exa-api
              mountPath: /run/secrets/exa
              readOnly: true
            - name: config-writable
              mountPath: /etc/searxng
      containers:
        - name: searxng
          image: harbor.okwilkins.dev/docker-hub-cache/searxng/searxng:2026.11.6-ac11e14c5
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config-writable
              mountPath: /etc/searxng
            - name: limiter-config
              mountPath: /etc/searxng/limiter.toml
              subPath: limiter.toml
            - name: cache
              mountPath: /var/cache/searxng
            - name: tmp
              mountPath: /tmp
          env:
            - name: SEARXNG_BASE_URL
              value: "https://search.okwilkins.dev"
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: SECRET
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 4180
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-oidc-secret
                  key: client-secret-plaintext
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-cookie-secret
                  key: cookie-secret
          volumeMounts:
            - name: oidc-provider-ca
              mountPath: /etc/ssl/certs/oidc-provider
              readOnly: true
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.okwilkins.dev
            - --provider-ca-file=/etc/ssl/certs/oidc-provider/ca.crt
            - --client-id=searxng
            - --scope=openid profile email groups
            - --code-challenge-method=S256
            - --upstream=http://localhost:8080
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --redirect-url=https://search.okwilkins.dev/oauth2/callback
            - --cookie-domain=.okwilkins.dev
            - --set-xauthrequest=true
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config-source
          configMap:
            name: searxng-settings
        - name: config-writable
          emptyDir: {}
        - name: exa-api
          secret:
            secretName: searxng-exa-api
        - name: limiter-config
          configMap:
            name: searxng-limiter
        - name: cache
          persistentVolumeClaim:
            claimName: searxng-cache-pvc
        - name: tmp
          emptyDir: {}
        - name: oidc-provider-ca
          secret:
            secretName: search-okwilkins-dev-tls
            items:
              - key: ca.crt
                path: ca.crt
