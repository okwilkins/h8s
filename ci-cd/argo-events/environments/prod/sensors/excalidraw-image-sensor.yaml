apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: excalidraw-image
  namespace: argo-events
  labels:
    app.kubernetes.io/name: excalidraw-image
    app.kubernetes.io/part-of: argo-events
    app.kubernetes.io/component: workflow-trigger
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: excalidraw-image
        app.kubernetes.io/part-of: argo-events
  dependencies:
    - name: push
      eventSourceName: github
      eventName: h8s
      transform:
        script: |
          event.matchedSha = nil
          local commits = (event.body or {}).commits or {}
          for i = #commits, 1, -1 do
            local commit = commits[i]
            local subject = (commit.message or ""):match("^[^\r\n]*")
            for _, change in ipairs({"added", "modified"}) do
              for _, path in ipairs(commit[change] or {}) do
                if path == "ci-cd/argo-events/environments/prod/sensors/excalidraw-image-sensor.yaml"
                    and (" " .. subject .. " "):find(" excalidraw/excalidraw ", 1, true) then
                  event.matchedSha = commit.id
                  return event
                end
              end
            end
          end
          return event
      filters:
        script: |
          local b = event.body
          if not b or b["X-GitHub-Event"] ~= "push" or not b.repository
              or b.repository.full_name ~= "okwilkins/h8s" or b.ref ~= "refs/heads/main"
              or b.deleted ~= false or type(b.after) ~= "string"
              or #b.after ~= 40 or not b.after:match("^[0-9a-f]+$") then return false end
          local sha = event.matchedSha
          return type(sha) == "string" and #sha == 40 and sha:match("^[0-9a-f]+$") ~= nil
  # Fixed names block duplicate commits until the Workflow TTL removes them.
  triggers:
    - template:
        name: build-excalidraw
        conditions: push
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: excalidraw
                namespace: argo-workflows
                labels:
                  app.kubernetes.io/name: image-build
                  app.kubernetes.io/part-of: argo-workflows
              spec:
                workflowTemplateRef:
                  name: image-build
                templateDefaults:
                  initContainers:
                    - name: checkout-excalidraw
                      image: harbor.okwilkins.dev/docker-hub-cache/alpine/git@sha256:29cff25811f790b9f72fc266bf8009a5a911714c0e03c31c47339c50909d9aef
                      imagePullPolicy: IfNotPresent
                      mirrorVolumeMounts: true
                      env:
                        - name: EXCALIDRAW_COMMIT
                          value: "{{workflow.parameters.image-tag}}"
                      command: ["/bin/sh", "-ec"]
                      args:
                        - |
                          # Only the build pod has the h8s source artifact.
                          test -d /workspace || exit 0
                          cd /workspace
                          # Reject a stale live sensor if the push beats Argo CD's sync.
                          grep -Fq "value: \"$EXCALIDRAW_COMMIT\"" ci-cd/argo-events/environments/prod/sensors/excalidraw-image-sensor.yaml ||
                            { echo "Sensor pin differs from the pushed commit. Wait for Argo CD to sync before rebuilding." >&2; exit 1; }
                          git init -q upstream
                          git -C upstream fetch --depth=1 https://github.com/excalidraw/excalidraw.git "$EXCALIDRAW_COMMIT"
                          git -C upstream checkout -q --detach "$EXCALIDRAW_COMMIT"
                      resources:
                        requests: {cpu: 50m, memory: 64Mi}
                        limits: {memory: 512Mi}
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities: {drop: [ALL]}
                arguments:
                  parameters:
                    - name: git-repository
                      value: https://github.com/okwilkins/h8s.git
                    - name: revision
                      value: ""
                    - name: containerfile
                      value: upstream/Dockerfile
                    - name: build-context
                      value: upstream
                    - name: image-repository
                      value: harbor.okwilkins.dev/main/excalidraw
                    - name: image-tag
                      value: "dabd83c4aa6b9e42d0dd0a42be62200eb8e3cce9"
                    - name: builder-image
                      value: harbor.okwilkins.dev/main/image-buildah@sha256:7838314627d13cb005d562421ea998a8a550a589f24cb70d7142a7d2facbd92c
                    - name: signer-image
                      value: harbor.okwilkins.dev/main/cosign@sha256:0873fe6b639d44f6973bc771ea19b39f545045731683070aede0da16417dcc83
                    - name: github-repository
                      value: okwilkins/h8s
                    - name: github-status-context
                      value: argo/excalidraw
          parameters:
            - src:
                dependencyName: push
                dataTemplate: "excalidraw-{{ .Input.matchedSha }}"
              dest: metadata.name
            - src:
                dependencyName: push
                dataKey: matchedSha
              dest: spec.arguments.parameters.1.value
      atLeastOnce: true
      retryStrategy:
        steps: 5
        duration: 5s
        factor: 2
        jitter: 0.2
