apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: image-buildah
  namespace: argo-events
  labels:
    app.kubernetes.io/name: image-buildah
    app.kubernetes.io/part-of: argo-events
    app.kubernetes.io/component: workflow-trigger
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-buildah
        app.kubernetes.io/part-of: argo-events
  dependencies:
    - name: push
      eventSourceName: github
      eventName: h8s
      filters:
        script: |
          local body = event.body
          if body == nil or body["X-GitHub-Event"] ~= "push"
              or body.repository == nil or body.repository.full_name ~= "okwilkins/h8s"
              or body.ref ~= "refs/heads/main" or body.deleted ~= false then
            return false
          end

          if type(body.after) ~= "string" or #body.after ~= 40
              or not body.after:match("^[0-9a-f]+$") then
            return false
          end

          for _, commit in ipairs(body.commits or {}) do
            for _, change in ipairs({"added", "modified", "removed"}) do
              for _, path in ipairs(commit[change] or {}) do
                if path:match("^images/image%-buildah/") or path:match("^images/common/") then
                  return true
                end
              end
            end
          end
          return false
  # Fixed names block duplicate commits until the Workflow TTL removes them.
  # A duplicate create logs AlreadyExists without starting another build.
  triggers:
    - template:
        name: build-image-buildah
        conditions: push
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: image-buildah
                namespace: argo-workflows
                labels:
                  app.kubernetes.io/name: image-build
                  app.kubernetes.io/part-of: argo-workflows
              spec:
                workflowTemplateRef:
                  name: image-build
                arguments:
                  parameters:
                    - name: git-repository
                      value: https://github.com/okwilkins/h8s.git
                    - name: revision
                      value: ""
                    - name: containerfile
                      value: images/image-buildah/Containerfile
                    - name: build-context
                      value: images
                    - name: image-repository
                      value: harbor.okwilkins.dev/main/image-buildah
                    - name: image-tag
                      value: ""
                    - name: builder-image
                      value: harbor.okwilkins.dev/main/image-buildah@sha256:c72738fd4587746dd87d162848aca7e2c66e9847a393b7561dc7d9a2e885d09f
                    - name: signer-image
                      value: harbor.okwilkins.dev/main/cosign@sha256:bba3aa875e3fc5c04222bcdca8dc948304a22d132939e7f7b2299f3e0e4e7bb4
                    - name: github-repository
                      value: okwilkins/h8s
                    - name: github-status-context
                      value: argo/image-buildah
          parameters:
            - src:
                dependencyName: push
                dataTemplate: "image-buildah-{{ .Input.body.after }}-amd64"
              dest: metadata.name
            - src:
                dependencyName: push
                dataKey: body.after
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: push
                dataTemplate: "{{ .Input.body.after }}-amd64"
              dest: spec.arguments.parameters.5.value
      atLeastOnce: true
      retryStrategy:
        steps: 5
        duration: 5s
        factor: 2
        jitter: 0.2
