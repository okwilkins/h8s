apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: personal-website-image
  namespace: argo-events
  labels:
    app.kubernetes.io/name: personal-website-image
    app.kubernetes.io/part-of: argo-events
    app.kubernetes.io/component: workflow-trigger
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personal-website-image
        app.kubernetes.io/part-of: argo-events
  dependencies:
    - name: release-tag
      eventSourceName: github
      eventName: h8s
      filters:
        script: |
          local b = event.body
          if not b or b["X-GitHub-Event"] ~= "push" or not b.repository
              or b.repository.full_name ~= "okwilkins/personal-website"
              or b.created ~= true or b.deleted ~= false or b.forced == true
              or type(b.after) ~= "string" or #b.after ~= 40 or not b.after:match("^[0-9a-f]+$")
              or type(b.ref) ~= "string" or #b.ref > 138 then return false end
          local major, minor, patch = b.ref:match("^refs/tags/(%d+)%.(%d+)%.(%d+)$")
          return major ~= nil and not (major:match("^0%d") or minor:match("^0%d") or patch:match("^0%d"))
  triggers:
    - template:
        name: build-personal-website
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: personal-website
                namespace: argo-workflows
                labels:
                  app.kubernetes.io/name: image-build
                  app.kubernetes.io/part-of: argo-workflows
              spec:
                workflowTemplateRef:
                  name: image-build
                arguments:
                  parameters:
                    - name: git-repository
                      value: https://github.com/okwilkins/personal-website.git
                    - name: revision
                      value: ""
                    - name: containerfile
                      value: Dockerfile
                    - name: image-repository
                      value: harbor.okwilkins.dev/main/personal-website
                    - name: image-tag
                      value: ""
                    - name: builder-image
                      value: harbor.okwilkins.dev/main/image-buildah@sha256:7838314627d13cb005d562421ea998a8a550a589f24cb70d7142a7d2facbd92c
                    - name: signer-image
                      value: harbor.okwilkins.dev/main/cosign@sha256:6af3038aecabf215c4f87336bc4bb51f83695189df28ecc4c2e31e76bb2e953a
                    - name: github-repository
                      value: okwilkins/personal-website
                    - name: github-status-context
                      value: argo/personal-website
          parameters:
            - src:
                dependencyName: release-tag
                dataTemplate: 'personal-website-{{ .Input.body.ref | sha256sum | trunc 32 }}'
              dest: metadata.name
            - src:
                dependencyName: release-tag
                dataKey: body.after
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: release-tag
                dataTemplate: '{{ trimPrefix "refs/tags/" .Input.body.ref }}'
              dest: spec.arguments.parameters.4.value
      atLeastOnce: true
      retryStrategy:
        steps: 5
        duration: 5s
        factor: 2
        jitter: 0.2
