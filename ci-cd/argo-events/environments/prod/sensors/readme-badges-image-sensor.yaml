apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: readme-badges-image
  namespace: argo-events
  labels:
    app.kubernetes.io/name: readme-badges-image
    app.kubernetes.io/part-of: argo-events
    app.kubernetes.io/component: workflow-trigger
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: readme-badges-image
        app.kubernetes.io/part-of: argo-events
  dependencies:
    - name: push
      eventSourceName: github
      eventName: h8s
      transform:
        script: |
          event.matchedSha = nil
          local commits = (event.body or {}).commits or {}
          for i = #commits, 1, -1 do
            local commit = commits[i]
            for _, change in ipairs({"added", "modified", "removed"}) do
              for _, path in ipairs(commit[change] or {}) do
                if path:match("^images/readme%-badges/") or path:match("^images/common/") then
                  event.matchedSha = commit.id
                  return event
                end
              end
            end
          end
          return event
      filters:
        script: |
          local b = event.body
          if not b or b["X-GitHub-Event"] ~= "push" or not b.repository
              or b.repository.full_name ~= "okwilkins/h8s" or b.ref ~= "refs/heads/main"
              or b.deleted ~= false or type(b.after) ~= "string"
              or #b.after ~= 40 or not b.after:match("^[0-9a-f]+$") then return false end
          local sha = event.matchedSha
          return type(sha) == "string" and #sha == 40 and sha:match("^[0-9a-f]+$") ~= nil
  # Fixed names block duplicate commits until the Workflow TTL removes them.
  triggers:
    - template:
        name: build-readme-badges
        conditions: push
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                name: readme-badges
                namespace: argo-workflows
                labels:
                  app.kubernetes.io/name: image-build
                  app.kubernetes.io/part-of: argo-workflows
              spec:
                workflowTemplateRef:
                  name: image-build
                arguments:
                  parameters:
                    - name: git-repository
                      value: https://github.com/okwilkins/h8s.git
                    - name: revision
                      value: ""
                    - name: containerfile
                      value: images/readme-badges/Containerfile
                    - name: build-context
                      value: images
                    - name: image-repository
                      value: harbor.okwilkins.dev/main/readme-badges
                    - name: image-tag
                      value: ""
                    - name: builder-image
                      value: harbor.okwilkins.dev/main/image-buildah@sha256:7838314627d13cb005d562421ea998a8a550a589f24cb70d7142a7d2facbd92c
                    - name: signer-image
                      value: harbor.okwilkins.dev/main/cosign@sha256:6af3038aecabf215c4f87336bc4bb51f83695189df28ecc4c2e31e76bb2e953a
                    - name: github-repository
                      value: okwilkins/h8s
                    - name: github-status-context
                      value: argo/readme-badges
          parameters:
            - src:
                dependencyName: push
                dataTemplate: "readme-badges-{{ .Input.matchedSha }}-amd64"
              dest: metadata.name
            - src:
                dependencyName: push
                dataKey: matchedSha
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: push
                dataTemplate: "{{ .Input.matchedSha }}-amd64"
              dest: spec.arguments.parameters.5.value
      atLeastOnce: true
      retryStrategy:
        steps: 5
        duration: 5s
        factor: 2
        jitter: 0.2
