# https://github.com/argoproj/argo-helm/blob/argo-events-2.4.28/charts/argo-events/values.yaml

configs:
  jetstream:
    versions:
      # renovate: image=docker.io/library/nats
      - version: 2.10.29
        natsImage: harbor.okwilkins.dev/docker-hub-cache/library/nats:2.10.29
        metricsExporterImage: harbor.okwilkins.dev/docker-hub-cache/natsio/prometheus-nats-exporter:0.14.0
        configReloaderImage: harbor.okwilkins.dev/docker-hub-cache/natsio/nats-server-config-reloader:0.14.0
        startCommand: /nats-server

global:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

controller:
  rbac:
    namespaced: true
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
