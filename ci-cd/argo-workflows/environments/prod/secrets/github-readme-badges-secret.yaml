apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-readme-badges
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: github-readme-badges
    app.kubernetes.io/part-of: argo-workflows
spec:
  refreshInterval: 30m
  target:
    name: github-readme-badges
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: readme-badges
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: readme-badges
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: readme-badges
    app.kubernetes.io/part-of: argo-workflows
spec:
  appID: "5864183"
  installID: "184403319"
  repositories: [h8s]
  permissions:
    contents: write
    pull_requests: write
  auth:
    privateKey:
      secretRef:
        name: h8s-workflows-github-app
        key: private-key
