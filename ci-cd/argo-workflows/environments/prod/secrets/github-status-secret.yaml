apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-status
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: github-status
    app.kubernetes.io/part-of: argo-workflows
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  target:
    name: github-status
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: argo-workflows/github-status
        property: token
