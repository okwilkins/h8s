apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: image-build
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: image-build
    app.kubernetes.io/part-of: argo-workflows
spec:
  entrypoint: publish
  onExit: report-final-status
  serviceAccountName: argo-workflow
  imagePullSecrets:
    - name: harbor-credentials
  arguments:
    parameters:
      - name: git-repository
        description: Git repository URL to clone.
      - name: revision
        description: Full 40-character Git commit SHA to build.
      - name: containerfile
        description: Containerfile or Dockerfile path relative to the Git checkout.
      - name: build-context
        description: Build context directory relative to the Git checkout.
        value: .
      - name: image-repository
        description: Harbor image repository without a tag or digest.
      - name: image-tag
        description: Image tag to publish.
      - name: builder-image
        description: Full Buildah runner image reference pinned by SHA-256 digest.
      - name: signer-image
        description: Full Cosign runner image reference pinned by SHA-256 digest.
      - name: github-repository
        description: Optional owner/repository for GitHub status reporting. Empty disables reporting.
        value: ""
      - name: github-status-context
        value: argo/image-build
  workflowMetadata:
    labels:
      app.kubernetes.io/name: image-build
      app.kubernetes.io/part-of: argo-workflows
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  synchronization:
    mutexes:
      - name: image-build
  activeDeadlineSeconds: 3600
  ttlStrategy:
    secondsAfterCompletion: 86400
  podGC:
    strategy: OnWorkflowSuccess
    deleteDelayDuration: 10m
  templates:
    - name: publish
      steps:
        - - name: report-pending
            when: "{{=workflow.parameters['github-repository'] != ''}}"
            templateRef:
              name: github-status
              template: report
            arguments:
              parameters:
                - name: repository
                  value: "{{workflow.parameters.github-repository}}"
                - name: revision
                  value: "{{workflow.parameters.revision}}"
                - name: context
                  value: "{{workflow.parameters.github-status-context}}"
                - name: state
                  value: pending
                - name: target-url
                  value: "https://workflows.okwilkins.dev/workflows/{{workflow.namespace}}/{{workflow.name}}"
        - - name: build-and-push
            template: build-and-push
        - - name: sign-and-verify
            templateRef:
              name: cosign-sign-and-verify
              template: sign-and-verify
            arguments:
              parameters:
                - name: image-reference
                  value: "{{steps.build-and-push.outputs.parameters.image-reference}}"
                - name: signer-image
                  value: "{{workflow.parameters.signer-image}}"
        - - name: sbom
            templateRef:
              name: syft-sbom
              template: generate-and-publish
            arguments:
              parameters:
                - name: image-reference
                  value: "{{steps.build-and-push.outputs.parameters.image-reference}}"
    - name: report-final-status
      steps:
        - - name: report
            when: "{{=workflow.parameters['github-repository'] != ''}}"
            templateRef:
              name: github-status
              template: report
            arguments:
              parameters:
                - name: repository
                  value: "{{workflow.parameters.github-repository}}"
                - name: revision
                  value: "{{workflow.parameters.revision}}"
                - name: context
                  value: "{{workflow.parameters.github-status-context}}"
                - name: state
                  value: "{{workflow.status}}"
                - name: target-url
                  value: "https://workflows.okwilkins.dev/workflows/{{workflow.namespace}}/{{workflow.name}}"
    - name: build-and-push
      nodeSelector:
        kubernetes.io/arch: amd64
      inputs:
        artifacts:
          - name: source-code
            path: /workspace
            git:
              repo: "{{workflow.parameters.git-repository}}"
              revision: "{{workflow.parameters.revision}}"
      outputs:
        parameters:
          - name: image-digest
            globalName: image-digest
            valueFrom:
              path: /tmp/image-digest
          - name: image-reference
            globalName: image-reference
            valueFrom:
              path: /tmp/image-reference
      volumes:
        - name: buildah-storage
          emptyDir:
            sizeLimit: 20Gi
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: var-tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: run-user
          emptyDir:
            sizeLimit: 64Mi
        - name: buildah-home
          emptyDir:
            sizeLimit: 64Mi
        - name: harbor-auth
          secret:
            secretName: harbor-argo-workflows-credentials
            defaultMode: 0440
            items:
              - key: username
                path: username
              - key: password
                path: password
        - name: registry-ca
          secret:
            secretName: workflows-okwilkins-dev-tls
            items:
              - key: ca.crt
                path: ca.crt
      container:
        image: "{{workflow.parameters.builder-image}}"
        imagePullPolicy: IfNotPresent
        workingDir: /workspace
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            umask 077

            if [ "${#GIT_REVISION}" -ne 40 ] || \
              ! printf '%s\n' "$GIT_REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
              printf 'revision must be a full lowercase Git commit SHA.\n' >&2
              exit 1
            fi

            for runner in "$BUILDER_IMAGE" "$SIGNER_IMAGE"; do
              if ! printf '%s\n' "$runner" | grep -Eq '^[^[:space:]@]+@sha256:[0-9a-f]{64}$'; then
                printf 'builder-image and signer-image must be full SHA-256-pinned image references.\n' >&2
                exit 1
              fi
            done

            if ! printf '%s\n' "$IMAGE_REPOSITORY" | grep -Eq '^harbor\.okwilkins\.dev/[a-z0-9][a-z0-9._/-]*$'; then
              printf 'image-repository must be a Harbor repository without a tag or digest.\n' >&2
              exit 1
            fi

            if ! printf '%s\n' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
              printf 'image-tag must be a valid image tag of at most 128 characters.\n' >&2
              exit 1
            fi

            mkdir -p "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME"
            chmod 0700 "$XDG_RUNTIME_DIR"
            trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT

            image="$IMAGE_REPOSITORY:$IMAGE_TAG"

            buildah login \
              --username "$(cat /var/run/secrets/harbor/username)" \
              --password-stdin \
              harbor.okwilkins.dev < /var/run/secrets/harbor/password

            buildah build \
              --platform linux/amd64 \
              --file "/workspace/$CONTAINERFILE" \
              --tag "$image" \
              "/workspace/$BUILD_CONTEXT"

            buildah push \
              --digestfile /tmp/image-digest \
              "$image" \
              "docker://$image"

            printf '%s@%s\n' "$IMAGE_REPOSITORY" "$(cat /tmp/image-digest)" > /tmp/image-reference
            cat /tmp/image-reference
        env:
          - name: GIT_REVISION
            value: "{{workflow.parameters.revision}}"
          - name: CONTAINERFILE
            value: "{{workflow.parameters.containerfile}}"
          - name: BUILD_CONTEXT
            value: "{{workflow.parameters.build-context}}"
          - name: IMAGE_REPOSITORY
            value: "{{workflow.parameters.image-repository}}"
          - name: IMAGE_TAG
            value: "{{workflow.parameters.image-tag}}"
          - name: BUILDER_IMAGE
            value: "{{workflow.parameters.builder-image}}"
          - name: SIGNER_IMAGE
            value: "{{workflow.parameters.signer-image}}"
          - name: XDG_RUNTIME_DIR
            value: /run/user/1000
          - name: XDG_CONFIG_HOME
            value: /home/buildah/.config
          - name: REGISTRY_AUTH_FILE
            value: /tmp/registry-auth.json
        securityContext:
          privileged: false
          # File-capability mapping helpers must be able to gain SETUID/SETGID.
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: true
          seccompProfile:
            type: Localhost
            localhostProfile: profiles/buildah.json
          capabilities:
            drop:
              - ALL
            add:
              - SETUID
              - SETGID
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 8Gi
          limits:
            cpu: "2"
            memory: 4Gi
            ephemeral-storage: 30Gi
        volumeMounts:
          - name: buildah-storage
            mountPath: /home/buildah/.local/share/containers
          - name: tmp
            mountPath: /tmp
          - name: var-tmp
            mountPath: /var/tmp
          - name: run-user
            mountPath: /run/user
          - name: buildah-home
            mountPath: /home/buildah
          - name: harbor-auth
            mountPath: /var/run/secrets/harbor
            readOnly: true
          - name: registry-ca
            mountPath: /etc/containers/certs.d/harbor.okwilkins.dev
            readOnly: true
