apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: readme-badges
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: readme-badges
    app.kubernetes.io/part-of: argo-workflows
spec:
  entrypoint: update
  serviceAccountName: argo-workflow
  imagePullSecrets:
    - name: harbor-credentials
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  synchronization:
    mutexes:
      - name: readme-badges
  activeDeadlineSeconds: 300
  ttlStrategy:
    secondsAfterCompletion: 86400
  podGC:
    strategy: OnWorkflowSuccess
    deleteDelayDuration: 10m
  templates:
    - name: update
      container:
        image: harbor.okwilkins.dev/main/readme-badges@sha256:abfb59027acf304b5dd0626b0eb00cf4da68f709c9d0fd90e468dbcfe208bc0d
        imagePullPolicy: IfNotPresent
        command: [/usr/local/bin/update-badges]
        env:
          - name: GITHUB_REPOSITORY
            value: okwilkins/h8s
          - name: GITHUB_BRANCH
            value: automation/readme-badges
          - name: GITHUB_TOKEN_FILE
            value: /var/run/secrets/github/token
          - name: BADGE_SOURCES
            value: |
              {
                "Talos": {
                  "path": "infrastructure/shared/common.auto.tfvars",
                  "pattern": "^talos_version\\s*=\\s*\"([^\"]+)\""
                },
                "Cilium": {
                  "path": "ci-cd/argocd/environments/prod/apps/cilium-helm.yaml",
                  "pattern": "^\\s*targetRevision: ([0-9.]+)\\s*$"
                },
                "ArgoCD_chart": {
                  "path": "ci-cd/argocd/environments/prod/apps/argocd-helm.yaml",
                  "pattern": "^\\s*targetRevision: ([0-9.]+)\\s*$"
                },
                "Kubernetes": {
                  "path": "infrastructure/shared/common.auto.tfvars",
                  "pattern": "^kubernetes_version\\s*=\\s*\"([^\"]+)\""
                }
              }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        volumeMounts:
          - name: github-token
            mountPath: /var/run/secrets/github
            readOnly: true
      volumes:
        - name: github-token
          secret:
            secretName: github-readme-badges
            defaultMode: 0440
