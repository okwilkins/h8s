apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: syft-sbom
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: syft-sbom
    app.kubernetes.io/part-of: argo-workflows
spec:
  entrypoint: generate-and-publish
  serviceAccountName: argo-workflow
  arguments:
    parameters:
      - name: image-reference
        description: Signed Harbor AMD64 image-manifest reference pinned by SHA-256 digest.
  workflowMetadata:
    labels:
      app.kubernetes.io/name: syft-sbom
      app.kubernetes.io/part-of: argo-workflows
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  ttlStrategy:
    secondsAfterCompletion: 86400
  podGC:
    strategy: OnWorkflowSuccess
    deleteDelayDuration: 10m
  templates:
    - name: generate-and-publish
      activeDeadlineSeconds: 900
      nodeSelector:
        kubernetes.io/arch: amd64
      inputs:
        parameters:
          - name: image-reference
      volumes:
        - name: sbom
          emptyDir:
            sizeLimit: 64Mi
        - name: scanner-tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: harbor-auth
          secret:
            secretName: harbor-argo-workflows-credentials
            defaultMode: 0440
            items:
              - key: username
                path: username
              - key: password
                path: password
        - name: registry-ca
          secret:
            secretName: workflows-okwilkins-dev-tls
            items:
              - key: ca.crt
                path: ca.crt
      containerSet:
        volumeMounts:
          - name: sbom
            mountPath: /sbom
        containers:
          - name: scan
            image: docker.io/anchore/syft:v1.57.1@sha256:03215d0e98b661d0ecbc8575dbc14d65be1743b5de5df6410aecb7e80f95b060
            imagePullPolicy: IfNotPresent
            workingDir: /tmp
            command: ["/syft"]
            args:
              - scan
              - "registry:{{inputs.parameters.image-reference}}"
              - --platform
              - linux/amd64
              - --scope
              - squashed
              - --output
              - syft-json=/sbom/sbom.syft.json
              - --output
              - spdx-json=/sbom/sbom.spdx.json
            env:
              - name: HOME
                value: /tmp
              - name: XDG_CACHE_HOME
                value: /tmp/cache
              - name: SYFT_CHECK_FOR_APP_UPDATE
                value: "false"
              - name: SYFT_REGISTRY_CA_CERT
                value: /var/run/secrets/registry-ca/ca.crt
              - name: SYFT_REGISTRY_AUTH_AUTHORITY
                value: harbor.okwilkins.dev
              - name: SYFT_REGISTRY_AUTH_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: harbor-argo-workflows-credentials
                    key: username
              - name: SYFT_REGISTRY_AUTH_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: harbor-argo-workflows-credentials
                    key: password
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: "2"
                memory: 2Gi
                ephemeral-storage: 4Gi
            volumeMounts:
              - name: scanner-tmp
                mountPath: /tmp
              - name: registry-ca
                mountPath: /var/run/secrets/registry-ca
                readOnly: true
          - name: main
            dependencies:
              - scan
            image: ghcr.io/oras-project/oras:v1.3.3@sha256:a4c54befd87d0366e0ba3ac3a9536a5288c8a3735acd3b635cdace59a2c559c8
            imagePullPolicy: IfNotPresent
            workingDir: /sbom
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                umask 077
                trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT

                oras login \
                  --registry-config "$REGISTRY_AUTH_FILE" \
                  --ca-file "$REGISTRY_CA_CERT" \
                  --username "$(cat "$HARBOR_CREDENTIALS/username")" \
                  --password-stdin "$REGISTRY" < "$HARBOR_CREDENTIALS/password"

                printf '{}\n' > /tmp/sbom-config.json

                publish_sbom() {
                  oras attach \
                    --registry-config "$REGISTRY_AUTH_FILE" \
                    --ca-file "$REGISTRY_CA_CERT" \
                    --artifact-type "$2" \
                    --config "/tmp/sbom-config.json:$2" \
                    --annotation "org.opencontainers.artifact.description=$1" \
                    "$IMAGE_REFERENCE" "$1:$3"

                  checksum=$(sha256sum "$1")
                  oras blob fetch \
                    --registry-config "$REGISTRY_AUTH_FILE" \
                    --ca-file "$REGISTRY_CA_CERT" \
                    --output "/tmp/$1" \
                    "${IMAGE_REFERENCE%@*}@sha256:${checksum%% *}"
                  cmp "$1" "/tmp/$1"
                  printf 'Published and checked %s for %s\n' "$1" "$IMAGE_REFERENCE"
                }

                publish_sbom sbom.spdx.json application/vnd.goharbor.harbor.sbom.v1 application/spdx+json
                publish_sbom sbom.syft.json application/vnd.syft+json application/vnd.syft+json
            env:
              - name: HOME
                value: /tmp
              - name: IMAGE_REFERENCE
                value: "{{inputs.parameters.image-reference}}"
              - name: REGISTRY
                value: harbor.okwilkins.dev
              - name: HARBOR_CREDENTIALS
                value: /var/run/secrets/harbor
              - name: REGISTRY_AUTH_FILE
                value: /tmp/registry-auth.json
              - name: REGISTRY_CA_CERT
                value: /var/run/secrets/registry-ca/ca.crt
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 64Mi
              limits:
                cpu: "1"
                memory: 512Mi
                ephemeral-storage: 256Mi
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: harbor-auth
                mountPath: /var/run/secrets/harbor
                readOnly: true
              - name: registry-ca
                mountPath: /var/run/secrets/registry-ca
                readOnly: true
