apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-events-helm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/part-of: argo-events
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-events
      targetRevision: 2.4.28
      helm:
        valueFiles:
          - $h8s/ci-cd/argo-events/environments/prod/values.yaml
    - repoURL: https://github.com/okwilkins/h8s
      targetRevision: HEAD
      ref: h8s
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-events
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ServerSideApply=true
