apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-events-resources
  namespace: argocd
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/part-of: argo-events
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/okwilkins/h8s
    targetRevision: HEAD
    path: ci-cd/argo-events/environments/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-events
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - SkipDryRunOnMissingResource=true
