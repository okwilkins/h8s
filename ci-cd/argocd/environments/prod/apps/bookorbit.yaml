apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookorbit
  namespace: argocd
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: bookorbit
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/okwilkins/h8s
    targetRevision: HEAD
    path: applications/bookorbit/environments/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: bookorbit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
