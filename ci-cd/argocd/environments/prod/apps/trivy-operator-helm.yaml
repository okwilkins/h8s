apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator-helm
  namespace: argocd
  labels:
    app.kubernetes.io/name: trivy-operator
    app.kubernetes.io/part-of: trivy-operator
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://aquasecurity.github.io/helm-charts/
      chart: trivy-operator
      targetRevision: 0.37.0
      helm:
        releaseName: trivy-operator
        valueFiles:
          - $h8s/security/trivy-operator/environments/prod/values.yaml
    - repoURL: https://github.com/okwilkins/h8s
      targetRevision: HEAD
      ref: h8s
      path: security/trivy-operator/environments/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ServerSideApply=true
