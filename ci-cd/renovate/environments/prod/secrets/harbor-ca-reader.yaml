apiVersion: v1
kind: ServiceAccount
metadata:
  name: renovate-harbor-ca-reader
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate-harbor-ca-reader
    app.kubernetes.io/part-of: renovate
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: renovate-harbor-ca-reader
  namespace: harbor
  labels:
    app.kubernetes.io/name: renovate-harbor-ca-reader
    app.kubernetes.io/part-of: renovate
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["harbor-okwilkins-dev-tls"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: renovate-harbor-ca-reader
  namespace: harbor
  labels:
    app.kubernetes.io/name: renovate-harbor-ca-reader
    app.kubernetes.io/part-of: renovate
subjects:
  - kind: ServiceAccount
    name: renovate-harbor-ca-reader
    namespace: renovate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: renovate-harbor-ca-reader
