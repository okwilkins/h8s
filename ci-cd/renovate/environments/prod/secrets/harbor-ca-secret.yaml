apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-harbor-ca
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate-harbor-ca
    app.kubernetes.io/part-of: renovate
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: harbor-ca
    kind: SecretStore
  target:
    name: renovate-harbor-ca
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: harbor-okwilkins-dev-tls
        property: ca.crt
