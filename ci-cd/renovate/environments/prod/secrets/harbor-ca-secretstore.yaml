apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: harbor-ca
  namespace: renovate
  labels:
    app.kubernetes.io/name: harbor-ca
    app.kubernetes.io/part-of: renovate
spec:
  provider:
    kubernetes:
      remoteNamespace: harbor
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: renovate-harbor-ca-reader
