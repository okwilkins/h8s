# https://artifacthub.io/packages/helm/cilium/cilium/1.20.0?modal=values

# -- (string) Kubernetes service host - use "auto" for automatic lookup from the cluster-info ConfigMap
k8sServiceHost: localhost
# -- (string) Kubernetes service port
k8sServicePort: 7445
# -- Configure L2 announcements
l2announcements:
  # -- Enable L2 announcements
  enabled: true
# -- (string) Kubernetes service host - use "auto" for automatic lookup from the cluster-info ConfigMap (kubeadm-based clusters only)
ipam:
  # -- Configure IP Address Management mode.
  # ref: https://docs.cilium.io/en/stable/network/concepts/ipam/
  mode: kubernetes
# Tunnel mode (VXLAN), no native routing
# Worker nodes are cloud VMs reachable only over Tailscale (L3, no ARP), so
# native routing with autoDirectNodeRoutes installs dead self-referential
# routes on them and drops all pod traffic. VXLAN only needs node-to-node
# connectivity: controlplanes tunnel over the LAN, workers over the tailnet.
routingMode: tunnel
# BPF masquerading: iptables-based masquerade cannot reverse-NAT replies that
# arrive raw at tailscale0 for tunneled flows, silently breaking pod traffic
# to node-IP backends (e.g. the API server). BPF masquerade keeps the conntrack
# state in the datapath so replies reach their pod.
bpf:
  masquerade: true
# Cluster pod CIDR, used as the no-masquerade range in tunnel mode: pod-to-pod
# traffic keeps its source IP inside the tunnel, while node-IP destinations
# (API server) are masqueraded. Without it everything is masqueraded and the
# pod-to-pod reply path breaks.
ipv4NativeRoutingCIDR: 10.244.0.0/16
# Explicit MTU to prevent auto-detection from picking up tailscale0's MTU of 1280
# 1450 = 1500 (ens18), 50 (VXLAN overhead)
# Workers tunnel over the tailnet (1280), PMTU discovery below handles that
MTU: 1450
# PMTUD sends ICMP "fragmentation needed" to pods when a route's MTU
# is smaller than the packet (e.g. cross-node via tailscale at 1280)
# safe for LAN-only clusters, only triggers on MTU mismatch
pmtuDiscovery:
  enabled: true
  packetizationLayerPMTUDMode: always
# -- resources & limits for the agent init containers
securityContext:
  capabilities:
    # -- Capabilities for the `cilium-agent` container
    ciliumAgent:
      # Use to set socket permission
      - CHOWN
      # Used to terminate envoy child process
      - KILL
      # Used since cilium modifies routing tables, etc...
      - NET_ADMIN
      # Used since cilium creates raw sockets, etc...
      - NET_RAW
      # Used since cilium monitor uses mmap
      - IPC_LOCK
      # Used in iptables. Consider removing once we are iptables-free
      # - SYS_MODULE
      # Needed to switch network namespaces (used for health endpoint, socket-LB).
      # We need it for now but might not need it for >= 5.11 specially
      # for the 'SYS_RESOURCE'.
      # In >= 5.8 there's already BPF and PERMON capabilities
      - SYS_ADMIN
      # Could be an alternative for the SYS_ADMIN for the RLIMIT_NPROC
      - SYS_RESOURCE
      # Both PERFMON and BPF requires kernel 5.8, container runtime
      # cri-o >= v1.22.0 or containerd >= v1.5.0.
      # If available, SYS_ADMIN can be removed.
      #- PERFMON
      #- BPF
      # Allow discretionary access control (e.g. required for package installation)
      - DAC_OVERRIDE
      # Allow to set Access Control Lists (ACLs) on arbitrary files (e.g. required for package installation)
      - FOWNER
      # Allow to execute program that changes GID (e.g. required for package installation)
      - SETGID
      # Allow to execute program that changes UID (e.g. required for package installation)
      - SETUID
    # -- Capabilities for the `clean-cilium-state` init container
    cleanCiliumState:
      # Most of the capabilities here are the same ones used in the
      # cilium-agent's container because this container can be used to
      # uninstall all Cilium resources, and therefore it is likely that
      # will need the same capabilities.
      # Used since cilium modifies routing tables, etc...
      - NET_ADMIN
      # Used in iptables. Consider removing once we are iptables-free
      # - SYS_MODULE
      # We need it for now but might not need it for >= 5.11 specially
      # for the 'SYS_RESOURCE'.
      # In >= 5.8 there's already BPF and PERMON capabilities
      - SYS_ADMIN
      # Could be an alternative for the SYS_ADMIN for the RLIMIT_NPROC
      - SYS_RESOURCE
      # Both PERFMON and BPF requires kernel 5.8, container runtime
      # cri-o >= v1.22.0 or containerd >= v1.5.0.
      # If available, SYS_ADMIN can be removed.
      #- PERFMON
      #- BPF
gatewayAPI:
  # -- Enable support for Gateway API in cilium
  # This will automatically set enable-envoy-config as well.
  enabled: true
  # -- Enable ALPN for all listeners configured with Gateway API. ALPN will attempt HTTP/2, then HTTP 1.1.
  # Note that this will also enable `appProtocol` support, and services that wish to use HTTP/2 will need to indicate that via their `appProtocol`.
  enableAlpn: true
  # -- Enable Backend Protocol selection support (GEP-1911) for Gateway API via appProtocol.
  enableAppProtocol: true
# -- Configure the kube-proxy replacement in Cilium BPF datapath
# Valid options are "true" or "false".
# ref: https://docs.cilium.io/en/stable/network/kubernetes/kubeproxy-free/
kubeProxyReplacement: true
# Prerequisite for Gateway API without kube-proxy replacement
# -- Configure N-S k8s service loadbalancing
nodePort:
  # -- Enable the Cilium NodePort service implementation.
  enabled: true
# -- Configure cgroup related configuration
cgroup:
  autoMount:
    # -- Enable auto mount of cgroup2 filesystem.
    # When `autoMount` is enabled, cgroup2 filesystem is mounted at
    # `cgroup.hostRoot` path on the underlying host and inside the cilium agent pod.
    # If users disable `autoMount`, it's expected that users have mounted
    # cgroup2 filesystem at the specified `cgroup.hostRoot` volume, and then the
    # volume will be mounted inside the cilium agent pod at the same path.
    enabled: false
  # -- Configure cgroup root where cgroup2 filesystem is mounted on the host (see also: `cgroup.autoMount`)
  hostRoot: /sys/fs/cgroup

dashboards:
  enabled: true
  namespace: monitoring
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop
      - tcp
      - flow
      - icmp
      - http
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: true
      namespace: monitoring
operator:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
  dashboards:
    enabled: true
    namespace: monitoring
hostFirewall:
  enabled: false
