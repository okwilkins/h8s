apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |-
    okwilkins.dev:53 {
        errors
        cache 30
        forward . 192.168.1.120 {
           max_concurrent 1000
        }
    }
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        # Longhorn's S3 client tries IPv6 even though this cluster has no IPv6 route.
        template IN AAAA s3.eu-central-003.backblazeb2.com {
            rcode NOERROR
        }

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
