# Query types and raw-log frame fields match the installed VictoriaLogs plugin:
# https://github.com/VictoriaMetrics/victorialogs-datasource/blob/v0.33.1/src/types.ts
# https://github.com/VictoriaMetrics/victorialogs-datasource/blob/v0.33.1/pkg/plugin/response_logs.go
# Client breakdowns use numeric stats and rowsToFields to name each category.
# Bar gauges need a nonempty default displayName to keep single-category labels;
# the empty displayName override lets each generated field supply its own name.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: http-traffic-dashboard
spec:
  folderRef: networking
  datasources:
    - inputName: DS_VICTORIALOGS
      datasourceName: victorialogs-default
  json: |
    {
      "__inputs": [
        {
          "name": "DS_VICTORIALOGS",
          "label": "VictoriaLogs",
          "description": "Gateway access logs",
          "type": "datasource",
          "pluginId": "victoriametrics-logs-datasource",
          "pluginName": "VictoriaLogs"
        }
      ],
      "uid": "http-traffic",
      "title": "HTTP Traffic",
      "description": "Detailed HTTP traffic, reported visitors, endpoints and gateway/backend diagnostics from completed access logs. New metadata appears after Envoy configuration sync. Cloudflare cache hits and requests blocked before the gateways are not captured. Browser/OS/device breakdowns are inferred from reported User-Agent; the map uses reported country codes, not precise IP locations. No Cloudflare Analytics API collection is required.",
      "schemaVersion": 39,
      "version": 4,
      "editable": true,
      "graphTooltip": 1,
      "tags": [
        "http",
        "gateways",
        "victorialogs"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "gateway",
            "label": "Gateway",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "${DS_VICTORIALOGS}"
            },
            "query": {
              "type": "fieldValue",
              "field": "gateway_name",
              "query": "log_type:=\"gateway-access\"",
              "limit": 1000
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": "*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "hostname",
            "label": "Hostname",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "${DS_VICTORIALOGS}"
            },
            "query": {
              "type": "fieldValue",
              "field": "authority",
              "query": "log_type:=\"gateway-access\" gateway_name:in($gateway)",
              "limit": 1000
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": "*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "path",
            "label": "Path",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "${DS_VICTORIALOGS}"
            },
            "query": {
              "type": "fieldValue",
              "field": "path",
              "query": "log_type:=\"gateway-access\" gateway_name:in($gateway) authority:in($hostname)",
              "limit": 1000
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": "*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "method",
            "label": "Method",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "${DS_VICTORIALOGS}"
            },
            "query": {
              "type": "fieldValue",
              "field": "method",
              "query": "log_type:=\"gateway-access\" gateway_name:in($gateway) authority:in($hostname)",
              "limit": 1000
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": "*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "status",
            "label": "Status",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "${DS_VICTORIALOGS}"
            },
            "query": {
              "type": "fieldValue",
              "field": "response_code",
              "query": "log_type:=\"gateway-access\" gateway_name:in($gateway) authority:in($hostname)",
              "limit": 1000
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": "*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "visitor",
            "label": "Reported visitor IP",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "${DS_VICTORIALOGS}"
            },
            "query": {
              "type": "fieldValue",
              "field": "cf_connecting_ip_reported",
              "query": "log_type:=\"gateway-access\" gateway_name:in($gateway) authority:in($hostname)",
              "limit": 1000
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": "*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "peer",
            "label": "Network peer IP",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "${DS_VICTORIALOGS}"
            },
            "query": {
              "type": "fieldValue",
              "field": "peer_address",
              "query": "log_type:=\"gateway-access\" gateway_name:in($gateway) authority:in($hostname) | copy downstream_remote_address as peer_address | replace_regexp (\":([0-9]+)$\", \"\") at peer_address | replace_regexp (\"^\\\\[(.*)\\\\]$\", \"${1}\") at peer_address | format if (cf_country_reported:in(\"\", \"-\")) \"Unknown\" as cf_country_reported | format if (user_agent:in(\"\", \"-\")) \"Unknown\" as user_agent | format if (upstream_cluster:in(\"\", \"-\")) \"Unknown\" as upstream_cluster | format if (response_code_details:in(\"\", \"-\")) \"Unknown\" as response_code_details | format if (upstream_transport_failure_reason:in(\"\", \"-\")) \"Unknown\" as upstream_transport_failure_reason",
              "limit": 1000
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": "*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "country",
            "label": "Reported country",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "${DS_VICTORIALOGS}"
            },
            "query": {
              "type": "fieldValue",
              "field": "cf_country_reported",
              "query": "log_type:=\"gateway-access\" gateway_name:in($gateway) authority:in($hostname) | copy downstream_remote_address as peer_address | replace_regexp (\":([0-9]+)$\", \"\") at peer_address | replace_regexp (\"^\\\\[(.*)\\\\]$\", \"${1}\") at peer_address | format if (cf_country_reported:in(\"\", \"-\")) \"Unknown\" as cf_country_reported | format if (user_agent:in(\"\", \"-\")) \"Unknown\" as user_agent | format if (upstream_cluster:in(\"\", \"-\")) \"Unknown\" as upstream_cluster | format if (response_code_details:in(\"\", \"-\")) \"Unknown\" as response_code_details | format if (upstream_transport_failure_reason:in(\"\", \"-\")) \"Unknown\" as upstream_transport_failure_reason",
              "limit": 1000
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": "*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "agent",
            "label": "User agent",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "${DS_VICTORIALOGS}"
            },
            "query": {
              "type": "fieldValue",
              "field": "user_agent",
              "query": "log_type:=\"gateway-access\" gateway_name:in($gateway) authority:in($hostname) | copy downstream_remote_address as peer_address | replace_regexp (\":([0-9]+)$\", \"\") at peer_address | replace_regexp (\"^\\\\[(.*)\\\\]$\", \"${1}\") at peer_address | format if (cf_country_reported:in(\"\", \"-\")) \"Unknown\" as cf_country_reported | format if (user_agent:in(\"\", \"-\")) \"Unknown\" as user_agent | format if (upstream_cluster:in(\"\", \"-\")) \"Unknown\" as upstream_cluster | format if (response_code_details:in(\"\", \"-\")) \"Unknown\" as response_code_details | format if (upstream_transport_failure_reason:in(\"\", \"-\")) \"Unknown\" as upstream_transport_failure_reason",
              "limit": 1000
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": "*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "backend",
            "label": "Backend",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "${DS_VICTORIALOGS}"
            },
            "query": {
              "type": "fieldValue",
              "field": "upstream_cluster",
              "query": "log_type:=\"gateway-access\" gateway_name:in($gateway) authority:in($hostname) | copy downstream_remote_address as peer_address | replace_regexp (\":([0-9]+)$\", \"\") at peer_address | replace_regexp (\"^\\\\[(.*)\\\\]$\", \"${1}\") at peer_address | format if (cf_country_reported:in(\"\", \"-\")) \"Unknown\" as cf_country_reported | format if (user_agent:in(\"\", \"-\")) \"Unknown\" as user_agent | format if (upstream_cluster:in(\"\", \"-\")) \"Unknown\" as upstream_cluster | format if (response_code_details:in(\"\", \"-\")) \"Unknown\" as response_code_details | format if (upstream_transport_failure_reason:in(\"\", \"-\")) \"Unknown\" as upstream_transport_failure_reason",
              "limit": 1000
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": "*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "flags",
            "label": "Response flag",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "${DS_VICTORIALOGS}"
            },
            "query": {
              "type": "fieldValue",
              "field": "response_flags",
              "query": "log_type:=\"gateway-access\" gateway_name:in($gateway) authority:in($hostname)",
              "limit": 1000
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": "*",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": []
          },
          {
            "name": "request_id",
            "label": "Request ID lookup",
            "type": "textbox",
            "description": "Exact match; * means all. Values are escaped as JSON strings.",
            "query": "*",
            "current": {
              "text": "*",
              "value": "*"
            },
            "options": []
          },
          {
            "name": "ray_id",
            "label": "Ray ID lookup",
            "type": "textbox",
            "description": "Exact match; * means all. Values are escaped as JSON strings.",
            "query": "*",
            "current": {
              "text": "*",
              "value": "*"
            },
            "options": []
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "title": "Requests",
          "type": "stat",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VICTORIALOGS}"
          },
          "description": "All matching completed access-log records, including requests with no HTTP response.",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "\u2014",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VICTORIALOGS}"
              },
              "expr": "log_type:=\"gateway-access\" gateway_name:in($gateway) authority:in($hostname) path:in($path) method:in($method) response_code:in($status) cf_connecting_ip_reported:in($visitor) | copy downstream_remote_address as peer_address | replace_regexp (\":([0-9]+)$\", \"\") at peer_address | replace_regexp (\"^\\\\[(.*)\\\\]$\", \"${1}\") at peer_address | format if (cf_country_reported:in(\"\", \"-\")) \"Unknown\" as cf_country_reported | format if (user_agent:in(\"\", \"-\")) \"Unknown\" as user_agent | format if (upstream_cluster:in(\"\", \"-\")) \"Unknown\" as upstream_cluster | format if (response_code_details:in(\"\", \"-\")) \"Unknown\" as response_code_details | format if (upstream_transport_failure_reason:in(\"\", \"-\")) \"Unknown\" as upstream_transport_failure_reason | filter peer_address:in($peer) cf_country_reported:in($country) user_agent:in($agent) upstream_cluster:in($backend) response_flags:in($flags) request_id:in(${request_id:json}) cf_ray:in(${ray_id:json}) | stats count() as requests",
              "queryType": "stats",
              "editorMode": "code",
              "legendFormat": "{{__name__}}",
              "maxLines": 1000,
              "direction": "desc"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 3,
          "title": "Requests / second",
          "type": "stat",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VICTORIALOGS}"
          },
          "description": "Average rate over the selected time range.",
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "noValue": "\u2014",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VICTORIALOGS}"
              },
              "expr": "log_type:=\"gateway-access\" gateway_name:in($gateway) authority:in($hostname) path:in($path) method:in($method) response_code:in($status) cf_connecting_ip_reported:in($visitor) | copy downstream_remote_address as peer_address | replace_regexp (\":([0-9]+)$\", \"\") at peer_address | replace_regexp (\"^\\\\[(.*)\\\\]$\", \"${1}\") at peer_address | format if (cf_country_reported:in(\"\", \"-\")) \"Unknown\" as cf_country_reported | format if (user_agent:in(\"\", \"-\")) \"Unknown\" as user_agent | format if (upstream_cluster:in(\"\", \"-\")) \"Unknown\" as upstream_cluster | format if (response_code_details:in(\"\", \"-\")) \"Unknown\" as response_code_details | format if (upstream_transport_failure_reason:in(\"\", \"-\")) \"Unknown\" as upstream_transport_failure_reason | filter peer_address:in($peer) cf_country_reported:in($country) user_agent:in($agent) upstream_cluster:in($backend) response_flags:in($flags) request_id:in(${request_id:json}) cf_ray:in(${ray_id:json}) | stats rate() as requests_per_second",
              "queryType": "stats",
              "editorMode": "code",
              "legendFormat": "{{__name__}}",
              "maxLines": 1000,
              "direction": "desc"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 4,
          "title": "Reported public IPs",
          "type": "stat",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VICTORIALOGS}"
          },
          "description": "Distinct reported CF-Connecting-IP values on public traffic. Addresses are not unique people or authenticated identities.",
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "\u2014",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VICTORIALOGS}"
              },
              "expr": "log_type:=\"gateway-access\" gateway_name:in($gateway) authority:in($hostname) path:in($path) method:in($method) response_code:in($status) cf_connecting_ip_reported:in($visitor) | copy downstream_remote_address as peer_address | replace_regexp (\":([0-9]+)$\", \"\") at peer_address | replace_regexp (\"^\\\\[(.*)\\\\]$\", \"${1}\") at peer_address | format if (cf_country_reported:in(\"\", \"-\")) \"Unknown\" as cf_country_reported | format if (user_agent:in(\"\", \"-\")) \"Unknown\" as user_agent | format if (upstream_cluster:in(\"\", \"-\")) \"Unknown\" as upstream_cluster | format if (response_code_details:in(\"\", \"-\")) \"Unknown\" as response_code_details | format if (upstream_transport_failure_reason:in(\"\", \"-\")) \"Unknown\" as upstream_transport_failure_reason | filter peer_address:in($peer) cf_country_reported:in($country) user_agent:in($agent) upstream_cluster:in($backend) response_flags:in($flags) request_id:in(${request_id:json}) cf_ray:in(${ray_id:json}) | stats count_uniq(cf_connecting_ip_reported) if (gateway_name:=\"cloudflare-gateway\" cf_connecting_ip_reported:!=\"\" cf_connecting_ip_reported:!=\"-\") as addresses",
              "queryType": "stats",
              "editorMode": "code",
              "legendFormat": "{{__name__}}",
              "maxLines": 1000,
              "direction": "desc"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 5,
          "title": "Active hostnames",
          "type": "stat",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VICTORIALOGS}"
          },
          "description": "Distinct HTTP hostnames in the selected records.",
          "gridPos": {
            "x": 18,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "\u2014",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VICTORIALOGS}"
              },
              "expr": "log_type:=\"gateway-access\" gateway_name:in($gateway) authority:in($hostname) path:in($path) method:in($method) response_code:in($status) cf_connecting_ip_reported:in($visitor) | copy downstream_remote_address as peer_address | replace_regexp (\":([0-9]+)$\", \"\") at peer_address | replace_regexp (\"^\\\\[(.*)\\\\]$\", \"${1}\") at peer_address | format if (cf_country_reported:in(\"\", \"-\")) \"Unknown\" as cf_country_reported | format if (user_agent:in(\"\", \"-\")) \"Unknown\" as user_agent | format if (upstream_cluster:in(\"\", \"-\")) \"Unknown\" as upstream_cluster | format if (response_code_details:in(\"\", \"-\")) \"Unknown\" as response_code_details | format if (upstream_transport_failure_reason:in(\"\", \"-\")) \"Unknown\" as upstream_transport_failure_reason | filter peer_address:in($peer) cf_country_reported:in($country) user_agent:in($agent) upstream_cluster:in($backend) response_flags:in($flags) request_id:in(${request_id:json}) cf_ray:in(${ray_id:json}) | stats count_uniq(authority) as hostnames",
              "queryType": "stats",
              "editorMode": "code",
              "legendFormat": "{{__name__}}",
              "maxLines": 1000,
              "direction": "desc"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 6,
          "title": "Response body bytes",
          "type": "stat",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "${DS_VICTORIALOGS}"
          },
          "description": "Total logged HTTP response body bytes. This is not tunnel or wire bandwidth; for WebSockets Envoy can include handshake headers.",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 6,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "noValue": "\u2014",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "${DS_VICTORIALOGS}"
              },
