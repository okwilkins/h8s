apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./folders.yaml
  - ./grafana-operator-dashboard.yaml
  - ./cilium/
  - ./argocd-dashboard.yaml
  - ./kubernetes/
  - ./cloudflared-dashboard.yaml
  - ./http-traffic-dashboard.yaml
  - ./cloudnative-pg-dashboard.yaml
  - ./harbor-dashboard.yaml
  - ./longhorn-dashboard.yaml
  - ./external-secrets-operator-dashboard.yaml
  - ./vault-dashboard.yaml
  - ./cert-manager-dashboard.yaml
  - ./argo-workflows-dashboard.yaml
  - ./fluent-bit-dashboard.yaml
  - ./victoria-logs-dashboard.yaml
patches:
  - target:
      group: grafana.integreatly.org
    patch: |-
      - op: add
        path: /spec/instanceSelector
        value:
          matchLabels:
            dashboards: grafana
