apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-telegram
    app.kubernetes.io/part-of: prometheus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: 'null'
            group_by: [alertname, namespace, severity]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - receiver: 'null'
                matchers:
                  - alertname=~"Watchdog|InfoInhibitor"
              - receiver: telegram
                matchers:
                  - severity="critical"
                group_wait: 10s
                group_interval: 5m
                repeat_interval: 4h
              - receiver: telegram
                matchers:
                  - severity="warning"
                group_wait: 1m
                group_interval: 15m
                repeat_interval: 24h
          inhibit_rules:
            - source_matchers: [severity="critical"]
              target_matchers: [severity=~"warning|info"]
              equal: [namespace, alertname]
            - source_matchers: [severity="warning"]
              target_matchers: [severity="info"]
              equal: [namespace, alertname]
          receivers:
            - name: 'null'
            - name: telegram
              telegram_configs:
                - bot_token: '{{ .BOT_TOKEN }}'
                  chat_id: {{ .CHAT_ID }}
                  send_resolved: true
                  parse_mode: HTML
                  message: |
                    {{ `{{ if eq .Status "resolved" }}✅{{ else if eq .CommonLabels.severity "critical" }}🔥{{ else }}⚠️{{ end }} <b>[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname | html }} for {{ .CommonLabels.namespace | html }}</b>
                    {{ range .Alerts }}
                    <b>Severity:</b> <code>{{ .Labels.severity | toUpper | html }}</code>
                    {{ if .Labels.pod }}<b>Pod:</b> <code>{{ .Labels.pod | html }}</code>
                    {{ else if .Labels.volume }}<b>Volume:</b> <code>{{ .Labels.volume | html }}</code>
                    {{ else if .Labels.persistentvolumeclaim }}<b>PVC:</b> <code>{{ .Labels.persistentvolumeclaim | html }}</code>
                    {{ else if .Labels.node }}<b>Node:</b> <code>{{ .Labels.node | html }}</code>
                    {{ else if .Labels.instance }}<b>Instance:</b> <code>{{ .Labels.instance | html }}</code>
                    {{ end }}<b>Duration:</b> {{ if eq .Status "resolved" }}{{ .EndsAt.Sub .StartsAt | humanizeDuration }}{{ else }}{{ .StartsAt | since | humanizeDuration }}{{ end }}
                    {{ if .Annotations.summary }}<b>Summary:</b> {{ .Annotations.summary | html }}
                    {{ end }}{{ if .Annotations.description }}<b>Description:</b> {{ .Annotations.description | html }}
                    {{ end }}
                    ---
                    {{ end }}` }}
  dataFrom:
    - extract:
        key: monitoring/telegram
