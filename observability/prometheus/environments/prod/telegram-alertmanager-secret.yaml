apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-telegram
    app.kubernetes.io/part-of: prometheus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: 'null'
            group_by: [alertname, namespace, severity]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - receiver: 'null'
                matchers:
                  - alertname=~"Watchdog|InfoInhibitor"
              - receiver: telegram
                matchers:
                  - severity="critical"
                group_wait: 10s
                group_interval: 5m
                repeat_interval: 4h
              - receiver: telegram
                matchers:
                  - severity="warning"
                group_wait: 1m
                group_interval: 15m
                repeat_interval: 24h
          inhibit_rules:
            - source_matchers: [severity="critical"]
              target_matchers: [severity=~"warning|info"]
              equal: [namespace, alertname]
            - source_matchers: [severity="warning"]
              target_matchers: [severity="info"]
              equal: [namespace, alertname]
          receivers:
            - name: 'null'
            - name: telegram
              telegram_configs:
                - bot_token: '{{ .BOT_TOKEN }}'
                  chat_id: {{ .CHAT_ID }}
                  send_resolved: true
  dataFrom:
    - extract:
        key: monitoring/telegram
