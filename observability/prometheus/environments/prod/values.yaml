# https://github.com/prometheus-community/helm-charts/blob/kube-prometheus-stack-92.16.0/charts/kube-prometheus-stack/values.yaml

namespaceOverride: monitoring
# Cilium replaces kube-proxy.
kubeProxy:
  enabled: false
kube-state-metrics:
  # Avoid cluster-wide Secret access
  # This will mean that global/namespace dashboard panels omit Secret counts.
  collectorsExclude:
    - secrets
  # Exclude Vault from Longhorn backup alerts, as it uses native Raft backups.
  metricLabelsAllowlist:
    - persistentvolumeclaims=[recurring-job-group.longhorn.io/encrypted-backup]
prometheus:
  prometheusSpec:
    securityContext:
      fsGroupChangePolicy: OnRootMismatch
    # Stops the need to have to specify release tags
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Stops the need to be in the same namespace
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelector: {}
    ruleNamespaceSelector: {}
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    storageSpec:
      volumeClaimTemplate:
        metadata:
          labels:
            recurring-job.longhorn.io/source: enabled
            recurring-job-group.longhorn.io/encrypted-backup: enabled
        spec:
          storageClassName: longhorn-encrypted
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
alertmanager:
  alertmanagerSpec:
    useExistingSecret: true
    configSecret: alertmanager-telegram
    securityContext:
      fsGroupChangePolicy: OnRootMismatch
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    storage:
      volumeClaimTemplate:
        metadata:
          labels:
            recurring-job.longhorn.io/source: enabled
            recurring-job-group.longhorn.io/encrypted-backup: enabled
        spec:
          storageClassName: longhorn-encrypted
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
grafana:
  enabled: false
