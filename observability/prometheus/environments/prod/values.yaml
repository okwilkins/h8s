# https://github.com/prometheus-community/helm-charts/blob/kube-prometheus-stack-92.14.0/charts/kube-prometheus-stack/values.yaml

namespaceOverride: monitoring
kube-state-metrics:
  # Avoid cluster-wide Secret access
  # This will mean that global/namespace dashboard panels omit Secret counts.
  collectorsExclude:
    - secrets
prometheus:
  prometheusSpec:
    securityContext:
      fsGroupChangePolicy: OnRootMismatch
    # Stops the need to have to specify release tags
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # Stops the need to be in the same namespace
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    storageSpec:
      volumeClaimTemplate:
        metadata:
          labels:
            recurring-job.longhorn.io/source: enabled
            recurring-job-group.longhorn.io/encrypted-backup: enabled
        spec:
          storageClassName: longhorn-encrypted
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
alertmanager:
  alertmanagerSpec:
    securityContext:
      fsGroupChangePolicy: OnRootMismatch
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    storage:
      volumeClaimTemplate:
        metadata:
          labels:
            recurring-job.longhorn.io/source: enabled
            recurring-job-group.longhorn.io/encrypted-backup: enabled
        spec:
          storageClassName: longhorn-encrypted
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
grafana:
  enabled: false
