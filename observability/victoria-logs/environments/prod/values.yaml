# https://artifacthub.io/packages/helm/victoriametrics/victoria-logs-single/0.12.4?modal=values
server:
  retentionPeriod: 30d
  podSecurityContext:
    fsGroupChangePolicy: OnRootMismatch
  statefulSet:
    spec:
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
  persistentVolume:
    size: 100Gi
    storageClassName: longhorn-encrypted
    extraLabels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/encrypted-backup: enabled
  serviceMonitor:
    enabled: true

dashboards:
  enabled: true
