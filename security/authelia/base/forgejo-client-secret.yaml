apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-forgejo-client-secret
  namespace: authelia
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/part-of: authelia
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  target:
    name: authelia-forgejo-client-secret
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: client-secret-hash
      remoteRef:
        key: authelia/forgejo-oidc
        property: client-secret-hash
