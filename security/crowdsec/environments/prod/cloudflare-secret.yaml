apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-cloudflare
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: crowdsec
    app.kubernetes.io/part-of: crowdsec
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  target:
    name: crowdsec-cloudflare
    creationPolicy: Owner
  data:
    - secretKey: CLOUDFLARE_ACCOUNT_ID
      remoteRef:
        key: crowdsec/cloudflare
        property: account_id
    - secretKey: CLOUDFLARE_ZONE_ID
      remoteRef:
        key: crowdsec/cloudflare
        property: zone_id
    - secretKey: CLOUDFLARE_BOUNCER_TOKEN
      remoteRef:
        key: crowdsec/cloudflare-token
        property: token
    - secretKey: API_KEY
      remoteRef:
        key: crowdsec/cloudflare
        property: bouncer_key
    - secretKey: CS_LAPI_SECRET
      remoteRef:
        key: crowdsec/cloudflare
        property: lapi_secret
    - secretKey: REGISTRATION_TOKEN
      remoteRef:
        key: crowdsec/cloudflare
        property: registration_token
