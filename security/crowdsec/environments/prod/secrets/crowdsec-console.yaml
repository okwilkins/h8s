apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-console
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: crowdsec
    app.kubernetes.io/part-of: crowdsec
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  target:
    name: crowdsec-console
    creationPolicy: Owner
  data:
    - secretKey: ENROLL_KEY
      remoteRef:
        key: crowdsec/console
        property: enroll_key
