apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-summary-analytics
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: crowdsec-daily-summary
    app.kubernetes.io/part-of: crowdsec
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  target:
    name: crowdsec-summary-analytics
    creationPolicy: Owner
  data:
    - secretKey: CLOUDFLARE_ACCOUNT_ID
      remoteRef:
        key: crowdsec/cloudflare
        property: account_id
    - secretKey: CLOUDFLARE_ANALYTICS_TOKEN
      remoteRef:
        key: crowdsec/cloudflare-analytics-token
        property: token
