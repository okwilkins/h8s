apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trivy-registry-ca
  namespace: trivy-system
  labels:
    app.kubernetes.io/name: trivy-operator
    app.kubernetes.io/part-of: trivy-operator
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: harbor-ca
    kind: SecretStore
  target:
    name: trivy-registry-ca
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef:
        key: harbor-okwilkins-dev-tls
        property: ca.crt
