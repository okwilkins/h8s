serviceMonitor:
  enabled: true

operator:
  infraAssessmentScannerEnabled: true
  metricsFindingsEnabled: true
  # Required by the detailed CVE dashboard panel, increases Prometheus time series.
  metricsVulnIdEnabled: true
  # INFO: Strict limits on CPU and concurrency to not make the cluster spin its fans up :)
  scanJobsConcurrentLimit: 1
  scanJobTimeout: 15m

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

trivyOperator:
  scanJobCustomVolumes:
    - name: registry-ca
      secret:
        secretName: trivy-registry-ca
  scanJobCustomVolumesMount:
    - name: registry-ca
      mountPath: /etc/ssl/certs/vault-ca.crt
      subPath: ca.crt
      readOnly: true

trivy:
  # Avoid filesystem-cache lock contention between containers in the same scan job.
  configFile:
    cache:
      backend: memory
  timeout: 10m0s
  resources:
    limits:
      cpu: 250m

nodeCollector:
  # Talos does not use systemd. Omit those mounts to avoid errors on its read-only root filesystem.
  # https://github.com/aquasecurity/trivy-operator/issues/2566
  volumeMounts:
    - name: var-lib-etcd
      mountPath: /var/lib/etcd
      readOnly: true
    - name: var-lib-kubelet
      mountPath: /var/lib/kubelet
      readOnly: true
    - name: var-lib-kube-scheduler
      mountPath: /var/lib/kube-scheduler
      readOnly: true
    - name: var-lib-kube-controller-manager
      mountPath: /var/lib/kube-controller-manager
      readOnly: true
    - name: etc-kubernetes
      mountPath: /etc/kubernetes
      readOnly: true
    - name: etc-cni-netd
      mountPath: /etc/cni/net.d/
      readOnly: true
  volumes:
    - name: var-lib-etcd
      hostPath:
        path: /var/lib/etcd
    - name: var-lib-kubelet
      hostPath:
        path: /var/lib/kubelet
    - name: var-lib-kube-scheduler
      hostPath:
        path: /var/lib/kube-scheduler
    - name: var-lib-kube-controller-manager
      hostPath:
        path: /var/lib/kube-controller-manager
    - name: etc-kubernetes
      hostPath:
        path: /etc/kubernetes
    - name: etc-cni-netd
      hostPath:
        path: /etc/cni/net.d/
