apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-backup-b2
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-backup-b2
    app.kubernetes.io/part-of: vault
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  target:
    name: vault-backup-b2
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: vault/backup-b2
