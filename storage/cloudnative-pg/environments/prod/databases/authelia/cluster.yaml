apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-authelia-prod
  namespace: authelia
  labels:
    app.kubernetes.io/name: authelia
    app.kubernetes.io/part-of: authelia
    app.kubernetes.io/component: database
spec:
  description: Postgres cluster for Authelia
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:26d15a12723510b0b416e8aec2bc65f2da7ac9b77ef3182a0911e4b8b991420a
  instances: 1
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/encrypted-backup: enabled
  storage:
    size: 1Gi
    storageClass: longhorn-encrypted
  resources:
    requests:
      memory: 128Mi
  managed:
    roles:
      - name: authelia
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: cnpg-authelia-prod-app-user-credentials
  enableSuperuserAccess: false
