apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-authelia-prod
  namespace: authelia
  labels:
    app.kubernetes.io/name: authelia
    app.kubernetes.io/part-of: authelia
    app.kubernetes.io/component: database
spec:
  description: Postgres cluster for Authelia
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:b98ae0b74a12f20ccff32219be0e33fdd35c7e2e8e73c8bff9173f1128e167d1
  instances: 1
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/encrypted-backup: enabled
  storage:
    size: 1Gi
    storageClass: longhorn-encrypted
  resources:
    requests:
      memory: 128Mi
  managed:
    roles:
      - name: authelia
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: cnpg-authelia-prod-app-user-credentials
  enableSuperuserAccess: false
