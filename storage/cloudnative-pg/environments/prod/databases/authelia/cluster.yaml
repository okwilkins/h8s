apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-authelia-prod
  namespace: authelia
spec:
  description: Postgres cluster for Authelia
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
  instances: 1
  storage:
    size: 1Gi
  resources:
    requests:
      memory: 128Mi
  managed:
    roles:
      - name: authelia
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: cnpg-authelia-prod-app-user-credentials
  enableSuperuserAccess: false
  monitoring:
    enablePodMonitor: true
