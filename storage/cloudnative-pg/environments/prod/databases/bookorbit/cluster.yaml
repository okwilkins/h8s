apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-bookorbit-prod
  namespace: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: bookorbit
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  description: Postgres cluster for BookOrbit
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:452a15584e2aa1ce658c4ae8538b5dc157eb031d41b82fd19882e0c03bcec01d
  imagePullPolicy: IfNotPresent
  instances: 1
  enablePDB: false
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/encrypted-backup: enabled
  storage:
    size: 5Gi
    storageClass: longhorn-encrypted
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  bootstrap:
    initdb:
      database: bookorbit
      owner: bookorbit
      secret:
        name: cnpg-bookorbit-prod-app-user-credentials
  managed:
    roles:
      - name: bookorbit
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: cnpg-bookorbit-prod-app-user-credentials
  postgresql:
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-18-trixie@sha256:d00bec5031990855e70b8dfaab136fb961787e81b7b0d2f3939020a68de1961f
          pullPolicy: IfNotPresent
  enableSuperuserAccess: false
