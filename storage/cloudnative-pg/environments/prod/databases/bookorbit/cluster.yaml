apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-bookorbit-prod
  namespace: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: bookorbit
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  description: Postgres cluster for BookOrbit
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:c8caac9817d2b5e5e66297a3ccf86d9fcbd68f097aa6cc00161d83f9635e88cc
  imagePullPolicy: IfNotPresent
  instances: 1
  enablePDB: false
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/encrypted-backup: enabled
  storage:
    size: 5Gi
    storageClass: longhorn-encrypted
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  bootstrap:
    initdb:
      database: bookorbit
      owner: bookorbit
      secret:
        name: cnpg-bookorbit-prod-app-user-credentials
  managed:
    roles:
      - name: bookorbit
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: cnpg-bookorbit-prod-app-user-credentials
  postgresql:
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-18-trixie@sha256:eef3dd247157d53acc8e6ac53b5b610474eaedcd93f722c89245a3171b58e10f
          pullPolicy: IfNotPresent
  enableSuperuserAccess: false
