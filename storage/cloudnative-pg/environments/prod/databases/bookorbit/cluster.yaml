apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-bookorbit-prod
  namespace: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: bookorbit
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  description: Postgres cluster for BookOrbit
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:b98ae0b74a12f20ccff32219be0e33fdd35c7e2e8e73c8bff9173f1128e167d1
  imagePullPolicy: IfNotPresent
  instances: 1
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/encrypted-backup: enabled
  storage:
    size: 5Gi
    storageClass: longhorn-encrypted
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  bootstrap:
    initdb:
      database: bookorbit
      owner: bookorbit
      secret:
        name: cnpg-bookorbit-prod-app-user-credentials
  managed:
    roles:
      - name: bookorbit
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: cnpg-bookorbit-prod-app-user-credentials
  postgresql:
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-18-trixie@sha256:77dd77f7a4d10f55d83cd71d9f707cbbf79293fe857ccce4a19c113d538a2fa9
          pullPolicy: IfNotPresent
  enableSuperuserAccess: false
