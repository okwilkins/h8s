apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-bookorbit-prod
  namespace: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: bookorbit
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  description: Postgres cluster for BookOrbit
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:ec2ed3404e89fff99643901b58a2a34c46a46345fe69a3d96500b82f995c327b
  imagePullPolicy: IfNotPresent
  instances: 1
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/encrypted-backup: enabled
  storage:
    size: 5Gi
    storageClass: longhorn-encrypted
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  bootstrap:
    initdb:
      database: bookorbit
      owner: bookorbit
      secret:
        name: cnpg-bookorbit-prod-app-user-credentials
  managed:
    roles:
      - name: bookorbit
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: cnpg-bookorbit-prod-app-user-credentials
  postgresql:
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-18-trixie@sha256:969f10190a34052c88492d5632ce3e49c042b59553ed363427235abdf93457d2
          pullPolicy: IfNotPresent
  enableSuperuserAccess: false
