apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-bookorbit-prod
  namespace: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: bookorbit
    app.kubernetes.io/component: database
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: cnpg-bookorbit-prod
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
