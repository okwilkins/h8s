apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-bookorbit-prod-app-user-credentials
  namespace: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
    app.kubernetes.io/part-of: bookorbit
    app.kubernetes.io/component: database
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  target:
    name: cnpg-bookorbit-prod-app-user-credentials
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: cnpg/cnpg-bookorbit-prod-app-user-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: cnpg/cnpg-bookorbit-prod-app-user-credentials
        property: password
