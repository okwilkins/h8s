apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-forgejo-prod
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/part-of: forgejo
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  description: Postgres cluster for Forgejo
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:26d15a12723510b0b416e8aec2bc65f2da7ac9b77ef3182a0911e4b8b991420a
  imagePullPolicy: IfNotPresent
  instances: 1
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/encrypted-backup: enabled
  storage:
    size: 5Gi
    storageClass: longhorn-encrypted
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      secret:
        name: cnpg-forgejo-prod-app-user-credentials
  managed:
    roles:
      - name: forgejo
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: cnpg-forgejo-prod-app-user-credentials
  enableSuperuserAccess: false
