apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-harbor-prod
  namespace: harbor
spec:
  description: Postgres cluster for Harbor
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
  instances: 1
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/encrypted-backup: enabled
  storage:
    size: 10Gi
    storageClass: longhorn-encrypted
  resources:
    requests:
      memory: 512Mi
  managed:
    roles:
      - name: harbor
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: cnpg-harbor-prod-app-user-credentials
  enableSuperuserAccess: false
  monitoring:
    enablePodMonitor: true
