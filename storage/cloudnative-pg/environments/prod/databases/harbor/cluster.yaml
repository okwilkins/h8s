apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-harbor-prod
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: harbor
    app.kubernetes.io/component: database
spec:
  description: Postgres cluster for Harbor
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:ec2ed3404e89fff99643901b58a2a34c46a46345fe69a3d96500b82f995c327b
  instances: 1
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/encrypted-backup: enabled
  storage:
    size: 10Gi
    storageClass: longhorn-encrypted
  resources:
    requests:
      memory: 512Mi
  managed:
    roles:
      - name: harbor
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: cnpg-harbor-prod-app-user-credentials
  enableSuperuserAccess: false
