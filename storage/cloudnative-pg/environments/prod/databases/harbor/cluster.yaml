apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-harbor-prod
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: harbor
    app.kubernetes.io/component: database
spec:
  description: Postgres cluster for Harbor
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:c8caac9817d2b5e5e66297a3ccf86d9fcbd68f097aa6cc00161d83f9635e88cc
  instances: 1
  enablePDB: false
  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/encrypted-backup: enabled
  storage:
    size: 10Gi
    storageClass: longhorn-encrypted
  resources:
    requests:
      memory: 512Mi
  managed:
    roles:
      - name: harbor
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: cnpg-harbor-prod-app-user-credentials
  enableSuperuserAccess: false
