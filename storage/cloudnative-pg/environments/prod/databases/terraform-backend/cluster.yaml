apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-terraform-backend-prod
  namespace: terraform
spec:
  description: Postgres cluster for the Terraform backend of this cluster
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
  instances: 1
  storage:
    size: 10Gi
  resources:
    requests:
      memory: 512Mi
  certificates:
    serverTLSSecret: pg-tf-backend-okwilkins-dev-tls
    serverCASecret: terraform-vault-root-ca
  postgresql:
    pg_hba:
      - hostssl all all all scram-sha-256
  managed:
    roles:
      - name: terraform
        ensure: present
        login: true
        superuser: false
        passwordSecret:
          name: cnpg-terraform-backend-prod-app-user-credentials
  enableSuperuserAccess: false
  monitoring:
    enablePodMonitor: true
