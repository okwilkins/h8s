# https://github.com/goharbor/harbor-helm/blob/v1.18.0/values.yaml

externalURL: https://harbor.okwilkins.dev
# Stop the old pod before moving its ReadWriteOnce volume to another node.
updateStrategy:
  type: Recreate
persistence:
  persistentVolumeClaim:
    registry:
      existingClaim: harbor-registry
    jobservice:
      jobLog:
        existingClaim: harbor-jobservice
    redis:
      existingClaim: data-harbor-redis-0
    trivy:
      existingClaim: data-harbor-trivy-0
expose:
  type: clusterIP
  tls:
    enabled: false
existingSecretAdminPassword: harbor-admin-credentials
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
database:
  type: external
  external:
    host: cnpg-harbor-prod-rw.harbor.svc.cluster.local
    port: 5432
    username: harbor
    coreDatabase: harbor_core
    existingSecret: cnpg-harbor-prod-app-user-credentials
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
