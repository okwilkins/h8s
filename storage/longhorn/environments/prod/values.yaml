# https://longhorn.io/docs/1.13.0/references/helm-values/

defaultBackupStore:
  backupTarget: s3://h8s-longhorn-backups@eu-central-003/
  backupTargetCredentialSecret: longhorn-b2

persistence:
  defaultClass: false
  reclaimPolicy: Retain
  defaultClassReplicaCount: 2
preUpgradeChecker:
  # https://github.com/longhorn/longhorn/issues/8707
  jobEnabled: false
metrics:
  enabled: true
  serviceMonitor:
    enabled: true

networkPolicies:
  # TCP/9500 also exposes the Longhorn API.
  # Allow only the Prometheus scraper.
  metricsScrapeSources:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          prometheus: prometheus-stack-kube-prom-prometheus
